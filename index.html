<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030812" />
  <title>Bluemantle Institute of Technology</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="scene">
    <div class="noise"></div>
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="grid"></div>
    <div class="candles" aria-hidden="true">
      <i style="--x:8%;--h:90px;--d:0s"></i><i style="--x:14%;--h:140px;--d:.7s"></i>
      <i style="--x:22%;--h:70px;--d:1.2s"></i><i style="--x:30%;--h:120px;--d:.3s"></i>
      <i style="--x:39%;--h:180px;--d:1.7s"></i><i style="--x:48%;--h:95px;--d:.9s"></i>
      <i style="--x:57%;--h:150px;--d:1.4s"></i><i style="--x:66%;--h:105px;--d:.2s"></i>
      <i style="--x:74%;--h:190px;--d:1.1s"></i><i style="--x:82%;--h:125px;--d:.5s"></i>
      <i style="--x:91%;--h:170px;--d:1.8s"></i>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Bluemantle Institute of Technology">
        <img src="/assets/bluemantle-logo.png" alt="Bluemantle Institute logo" />
        <span>
          <strong>BLUEMANTLE INSTITUTE OF TECHNOLOGY</strong>
          <small>LEARN&nbsp;&nbsp;·&nbsp;&nbsp;EVOLVE&nbsp;&nbsp;·&nbsp;&nbsp;EXCEL</small>
        </span>
      </a>
      <div class="top-note">KNOWLEDGE MOVES WORLDS <b></b></div>
      <a class="home-pill" href="/">⌂ <span>Back to Home</span></a>
    </header>

    <main id="app" class="content"></main>

    <footer class="footer">
      <div>
        <strong>BLUEMANTLE INSTITUTE OF TECHNOLOGY</strong>
        <span>KNOWLEDGE&nbsp;&nbsp;·&nbsp;&nbsp;OPPORTUNITY&nbsp;&nbsp;·&nbsp;&nbsp;GLOBAL MINDS</span>
      </div>
      <div class="footer-right">
        <span>Shaping Learners</span>
        <span>Building a Better Tomorrow</span>
      </div>
    </footer>
  </div>
  <script src="/script.js"></script>
</body>
</html>
